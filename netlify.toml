# ============================================================================
#  netlify.toml — настройки сборки сайта на Netlify.
#  Говорит Netlify: собери проект командой `npm run build` и опубликуй
#  папку `dist` (готовый сайт). Без этого Netlify по ошибке отдаёт исходники
#  и страница открывается пустой.
# ============================================================================
[build]
  command = "npm run build"   # Команда сборки (Vite соберёт сайт в папку dist)
  publish = "dist"            # Какую папку публиковать = готовый сайт

[build.environment]
  NODE_VERSION = "20"         # Версия Node для сборки (Vite 6 требует 18+)
